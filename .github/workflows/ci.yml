name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma generate(postinstall)가 요구하는 값. 실제 DB에는 연결하지 않는다.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soom?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/soom?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
